apiVersion: apps/v1
kind: Deployment
metadata:
  name: jewelia-backend
  labels:
    app: jewelia-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jewelia-backend
  template:
    metadata:
      labels:
        app: jewelia-backend
    spec:
      containers:
      - name: jewelia-backend
        image: jewelia-backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: jewelia-secrets
              key: db-host
        - name: DB_PORT
          value: "5432"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: jewelia-secrets
              key: db-username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jewelia-secrets
              key: db-password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: jewelia-secrets
              key: db-name
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jewelia-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jewelia-backend-service
spec:
  selector:
    app: jewelia-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: LoadBalancer
